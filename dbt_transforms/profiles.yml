ecom_dbt_profile:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID', 'dataeng-505315') }}"
      dataset: ecom_silver
      threads: 4
      timeout_seconds: 300
      location: us-central1

    service_account:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID', 'dataeng-505315') }}"
      dataset: ecom_silver
      keyfile: "../credentials/gcp_key.json"
      threads: 4
      timeout_seconds: 300
      location: us-central1
